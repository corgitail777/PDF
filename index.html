変換（Stage 3-3 OCR改善 / ブラウザ版）</header><main><div class="bar"><input id="file" type="file" accept="application/pdf,.pdf"><button id="scan" disabled>PDFを解析</button><button id="save" disabled>Excelを保存</button><span id="status" class="status">PDFを選択してください</span></div><div class="notice">PDFはブラウザ内で処理します。日本語OCRは初回に外部配信元から言語データを取得します。社内文書の取り扱い規程を確認してください。OCR誤認識は右側で修正できます。文字の再認識候補を追加しました。誤認識は必ず原本と照合してください。赤文字・赤枠の処理は前版のままです。</div><div class="cols"><section class="panel"><h2>PDF原本（選択行を赤枠表示）</h2><div class="preview"><canvas id="page"></canvas></div><div id="pages" class="status"></div></section><section class="panel"><h2>OCR結果（クリックして修正）</h2><div id="items" class="items">解析するとここに表示されます。</div></section></div></main>

async function drawPage(n){if(!pdf)return;const page=await pdf.getPage(n),v=page.getViewport({scale:1.7});canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);await page.render({canvasContext:ctx,viewport:v}).promise;currentPage=n;$('pages').textContent=`${n} / ${pdf.numPages} ページ`;if(selected>=0&&rows[selected]?.page===n){let r=rows[selected];ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.strokeRect(r.x*v.width,r.y*v.height,r.w*v.width,r.h*v.height)}}
function splitLine(line, width, height, pageNo){

 }groups.push(group);

  const a=horizontal[i],b=horizontal[j];if(b.y-a.y<h*.035||b.y-a.y>h*.25)continue;

// Detect long, thin, nearly straight strokes independently from OCR.

     if(len>=w*.11)horizontal.push({dir:'h',page:pageNo,red,x:start/w,y:y/h,w:len/w,h:0});

   let start=-1;

// Stage 3-2C: pair the two vertical red edges as one rectangle.
// The scanned top/bottom strokes may be faint, so their absence does not prevent closure.
// Stage 3-2C: use actual red horizontal edges to constrain rectangle geometry.
// Never enlarge a box by joining unrelated vertical strokes.
function findRedRectangles(strokes,pageNo){
 const hs=strokes.filter(s=>s.page===pageNo&&s.red&&s.dir==='h'&&s.w>.075);

function paintClosedRectangle(ws,box,cols,rs){
 const clamp=(n,max)=>Math.max(1,Math.min(max,n));

 // remain within one grid cell of the intended PDF coordinates.

  const t=ws.getCell(top,c),b=ws.getCell(bottom,c);
  t.border={...t.border,top:red};b.border={...b.border,bottom:red};

  const l=ws.getCell(r,left),rr=ws.getCell(r,right);

}
function strokeBelongsToBox(stroke,box){

function paintStroke(ws,line,cols,rs){

  const r=clamp(Math.round(line.y*rs)+1,rs),left=clamp(Math.floor(line.x*cols)+1,cols),right=clamp(Math.ceil((line.x+line.w)*cols),cols);

function isRedText(r, image){if(!image)return false;const {data,width,height}=image;const x0=Math.max(0,Math.floor(r.x*width)),x1=Math.min(width,Math.ceil((r.x+r.w)*width)),y0=Math.max(0,Math.floor(r.y*height)),y1=Math.min(height,Math.ceil((r.y+r.h)*height));let red=0,dark=0;for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){const i=(y*width+x)*4,a=data[i],b=data[i+1],c=data[i+2];if(a>105&&a>b*1.45&&a>c*1.45&&a-b>45)red++;else if(a<155&&b<155&&c<155)dark++;}return red>=3&&red>dark*.24;}

// Stage 3-3: Optional independent OCR on the selected block. Does not change

async function reRecognize(row){

$('scan').onclick=async()=>{if(!pdf)return;$('scan').disabled=true;$('save').disabled=true;rows=[];redBoxes=[];detectedLines=[];pageInfo=[];selected=-1;let worker;try{if(ocrWorker){await ocrWorker.terminate();ocrWorker=null;}if(!window.Tesseract||!window.ExcelJS)throw Error('外部ライブラリを読み込めません。ネットワーク制限を確認してください。');worker=await Tesseract.createWorker('jpn+eng',1,{logger:m=>{if(m.status==='recognizing text')status(`OCR: ${Math.round(m.progress*100)}%`)}});await worker.setParameters({preserve_interword_spaces:'1'});for(let n=1;n<=pdf.numPages;n++){status(`ページ ${n}/${pdf.numPages} を認識中`);const page=await pdf.getPage(n),v=page.getViewport({scale:2});const off=document.createElement('canvas');off.width=Math.ceil(v.width);off.height=Math.ceil(v.height);await page.render({canvasContext:off.getContext('2d'),viewport:v}).promise;pageCanvases.set(n,off);const res=await worker.recognize(off);let lines=res.data.lines||[];const image=off.getContext('2d',{willReadFrequently:true}).getImageData(0,0,off.width,off.height);const strokes=detectStrokes(off,n);detectedLines.push(...strokes);redBoxes.push(...findRedRectangles(strokes,n));for(let line of lines){if(!(line.text||'').trim()||!line.bbox)continue;for(const block of splitLine(line,off.width,off.height,n)){block.red=isRedText(block,image);rows.push(block)}}pageInfo.push({page:n,width:page.view[2]-page.view[0],height:page.view[3]-page.view[1]})}rows.sort((a,b)=>a.page-b.page||a.y-b.y||a.x-b.x);renderItems();$('save').disabled=!rows.length;status(`${rows.length}行を認識しました。誤字を確認してください。`)}catch(err){status('解析エラー: '+err.message)}finally{ocrWorker=worker||null;$('scan').disabled=false}};
// Export-only spacing correction. Keep OCR inputs unchanged for manual review.
function compactJapaneseSpacing(text){
 const jp='\u3040-\u30ff\u3400-\u9fff\uff00-\uffef';
 // Remove only gaps separating two Japanese characters; preserve Latin/numeric spacing.
 return String(text).replace(new RegExp('(['+jp+'])[ \u3000]+(?=['+jp+'])','g'),'$1');

$('save').onclick=async()=>{if(!rows.length)return;try{
 const book=new ExcelJS.Workbook();book.creator='PDFExcel Web Stage 3-2C Borders';
 for(let p=1;p<=pdf.numPages;p++){
  const info=pageInfo.find(i=>i.page===p);const landscape=info&&info.width>info.height;
  const ws=book.addWorksheet('Page '+p,{pageSetup:{paperSize:9,orientation:landscape?'landscape':'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1}});
  const colCount=60,rowCount=70;for(let c=1;c<=colCount;c++)ws.getColumn(c).width=2.6;
  for(let r=1;r<=rowCount;r++)ws.getRow(r).height=14;
  const taken=new Set();
  for(const line of rows.filter(x=>x.page===p)){
   let r=Math.max(1,Math.min(rowCount,Math.floor(line.y*rowCount)+1));let c=Math.max(1,Math.min(colCount,Math.floor(line.x*colCount)+1));
   let end=Math.min(colCount,Math.max(c,Math.ceil((line.x+line.w)*colCount)));
   while(taken.has(`${r},${c}`)&&r<rowCount)r++;
   if(taken.has(`${r},${c}`))continue;
   // Do not merge across an occupied cell: independent OCR blocks remain editable.
   while(end>c&&Array.from({length:end-c+1},(_,i)=>`${r},${c+i}`).some(k=>taken.has(k)))end--;
   for(let j=c;j<=end;j++)taken.add(`${r},${j}`);
   if(end>c)try{ws.mergeCells(r,c,r,end)}catch(e){}
