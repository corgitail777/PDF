<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF→Excel 変換 Stage 2</title><style>body{font-family:system-ui,'Yu Gothic',sans-serif;margin:0;background:#f3f5f9;color:#1e293b}header{background:#17365d;color:white;padding:15px 24px;font-size:20px;font-weight:bold}main{padding:16px;max-width:1500px;margin:auto}.bar{background:white;border:1px solid #d9e1ed;border-radius:10px;padding:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:10px 16px;background:#1768b2;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{background:#a7b0bb}input[type=file]{max-width:320px}.status{font-size:13px;color:#475569}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.panel{background:white;border:1px solid #d9e1ed;border-radius:10px;padding:12px;min-width:0}.panel h2{font-size:16px;margin:0 0 10px}.preview{overflow:auto;max-height:74vh;background:#e8edf3;text-align:center}.preview canvas{max-width:100%;height:auto;box-shadow:0 2px 9px #9ca3af;display:block;margin:auto}.items{max-height:70vh;overflow:auto}.item{border-bottom:1px solid #e2e8f0;padding:9px 4px;display:grid;grid-template-columns:65px 1fr;gap:8px;align-items:center}.item input{width:96%;box-sizing:border-box;padding:7px;font-size:14px}.item small{color:#64748b}.item.low{background:#fff5d7}.item.selected{outline:2px solid #e14b4b;outline-offset:-2px}.notice{font-size:13px;line-height:1.6;color:#475569;margin-top:12px}@media(max-width:850px){.cols{grid-template-columns:1fr}.preview{max-height:55vh}}</style></head><body><header>PDF → Excel 変換（Stage 2 / ブラウザ版）</header><main><div class="bar"><input id="file" type="file" accept="application/pdf,.pdf"><button id="scan" disabled>PDFを解析</button><button id="save" disabled>Excelを保存</button><span id="status" class="status">PDFを選択してください</span></div><div class="notice">PDFはブラウザ内で処理します。日本語OCRは初回に外部配信元から言語データを取得します。社内文書の取り扱い規程を確認してください。OCR誤認識は右側で修正できます。罫線・図形の自動再現は未実装です。</div><div class="cols"><section class="panel"><h2>PDF原本（選択行を赤枠表示）</h2><div class="preview"><canvas id="page"></canvas></div><div id="pages" class="status"></div></section><section class="panel"><h2>OCR結果（クリックして修正）</h2><div id="items" class="items">解析するとここに表示されます。</div></section></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script>
'use strict';
const $=id=>document.getElementById(id), canvas=$('page'),ctx=canvas.getContext('2d');let pdf=null,rows=[],currentPage=1,pageInfo=[],selected=-1;const status=s=>$('status').textContent=s;
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
$('file').addEventListener('change',async e=>{rows=[];$('save').disabled=true;$('scan').disabled=true;const f=e.target.files[0];if(!f)return;try{pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;currentPage=1;await drawPage(1);$('scan').disabled=false;$('items').textContent='「PDFを解析」を押してください。';status(`${pdf.numPages}ページ読み込みました`)}catch(err){status('PDF読込エラー: '+err.message)}});
async function drawPage(n){if(!pdf)return;const page=await pdf.getPage(n),v=page.getViewport({scale:1.7});canvas.width=Math.ceil(v.width);canvas.height=Math.ceil(v.height);await page.render({canvasContext:ctx,viewport:v}).promise;currentPage=n;$('pages').textContent=`${n} / ${pdf.numPages} ページ`;if(selected>=0&&rows[selected]?.page===n){let r=rows[selected];ctx.strokeStyle='#ef4444';ctx.lineWidth=3;ctx.strokeRect(r.x*v.width,r.y*v.height,r.w*v.width,r.h*v.height)}}
function renderItems(){const root=$('items');root.replaceChildren();rows.forEach((r,i)=>{let div=document.createElement('div');div.className='item'+(r.conf<65?' low':'')+(selected===i?' selected':'');let label=document.createElement('small');label.textContent=`P${r.page} / ${Math.round(r.conf)}%`;let inp=document.createElement('input');inp.value=r.text;inp.setAttribute('aria-label',`ページ${r.page} 認識行${i+1}`);inp.addEventListener('input',()=>r.text=inp.value);inp.addEventListener('focus',async()=>{selected=i;document.querySelectorAll('.item.selected').forEach(e=>e.classList.remove('selected'));div.classList.add('selected');await drawPage(r.page)});div.append(label,inp);root.append(div)});if(!rows.length)root.textContent='文字が検出されませんでした。'}
$('scan').onclick=async()=>{if(!pdf)return;$('scan').disabled=true;$('save').disabled=true;rows=[];selected=-1;let worker;try{if(!window.Tesseract||!window.ExcelJS)throw Error('外部ライブラリを読み込めません。ネットワーク制限を確認してください。');worker=await Tesseract.createWorker('jpn+eng',1,{logger:m=>{if(m.status==='recognizing text')status(`OCR: ${Math.round(m.progress*100)}%`)}});await worker.setParameters({preserve_interword_spaces:'1'});for(let n=1;n<=pdf.numPages;n++){status(`ページ ${n}/${pdf.numPages} を認識中`);const page=await pdf.getPage(n),v=page.getViewport({scale:2});const off=document.createElement('canvas');off.width=Math.ceil(v.width);off.height=Math.ceil(v.height);await page.render({canvasContext:off.getContext('2d'),viewport:v}).promise;const res=await worker.recognize(off);let lines=res.data.lines||[];for(let line of lines){let t=(line.text||'').trim();if(!t)continue;let b=line.bbox;rows.push({page:n,text:t,conf:line.confidence??0,x:b.x0/off.width,y:b.y0/off.height,w:(b.x1-b.x0)/off.width,h:(b.y1-b.y0)/off.height})}pageInfo.push({page:n,width:page.view[2]-page.view[0],height:page.view[3]-page.view[1]})}rows.sort((a,b)=>a.page-b.page||a.y-b.y||a.x-b.x);renderItems();$('save').disabled=!rows.length;status(`${rows.length}行を認識しました。誤字を確認してください。`)}catch(err){status('解析エラー: '+err.message)}finally{if(worker)await worker.terminate();$('scan').disabled=false}};
$('save').onclick=async()=>{if(!rows.length)return;try{const book=new ExcelJS.Workbook();book.creator='PDFExcel Web Stage 2';for(let p=1;p<=pdf.numPages;p++){const ws=book.addWorksheet('Page '+p,{pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1}});const colCount=60,rowCount=85;for(let c=1;c<=colCount;c++)ws.getColumn(c).width=2.6;for(let r=1;r<=rowCount;r++)ws.getRow(r).height=11;const taken=new Set();for(const line of rows.filter(x=>x.page===p)){let r=Math.min(rowCount,Math.max(1,Math.round(line.y*(rowCount-1))+1));let c=Math.min(colCount,Math.max(1,Math.round(line.x*(colCount-1))+1));while(taken.has(`${r},${c}`)&&r<rowCount)r++;taken.add(`${r},${c}`);const cell=ws.getCell(r,c);cell.value=line.text;cell.font={name:'Yu Gothic',size:Math.max(8,Math.min(16,Math.round(line.h*rowCount*8)))};cell.alignment={vertical:'middle',wrapText:false};const end=Math.min(colCount,Math.max(c,Math.round((line.x+line.w)*(colCount-1))+1));if(end>c){try{ws.mergeCells(r,c,r,end)}catch(e){/* overlapping OCR regions remain editable without merge */}}}ws.pageSetup.printArea=`A1:BH${rowCount}`;ws.views=[{showGridLines:false}]}const buf=await book.xlsx.writeBuffer();const url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const a=document.createElement('a');a.href=url;a.download=($('file').files[0]?.name||'PDF').replace(/\.pdf$/i,'')+'_OCR.xlsx';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);status('Excelを保存しました（レイアウトは推定です）')}catch(err){status('Excel出力エラー: '+err.message)}};
</script></body></html>
